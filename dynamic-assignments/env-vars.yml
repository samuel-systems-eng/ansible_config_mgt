---
- name: Collate variables from environment-specific file
  hosts: all
  ignore_unreachable: true # 🛡️ SECURE PROTECTION: Prevents stopped nodes from crashing the variable lookup stage
  tasks:
    - name: Dynamically include environment variables
      include_vars:
        file: "{{ playbook_dir }}/../env_vars/{{ inventory_file | default('dev') | basename | splitext | first }}.yml"
      tags:
        - always
