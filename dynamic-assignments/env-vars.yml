---
- name: Collate variables from environment-specific file
  hosts: all
  tasks:
    - name: Dynamically include environment variables
      include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ env }}.yml"
            - "default.yml"
          paths:
            - "{{ playbook_dir }}/../env-vars"
      tags:
        - always
