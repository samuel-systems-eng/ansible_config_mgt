---
# PLAY 1: Comprehensive Cluster Deployment
- name: Hardened Multi-Tier Infrastructure Deployment
  hosts: all
  become: true
  remote_user: ec2-user
  ignore_unreachable: true
  tasks:
    # 1. Dynamically resolve variables based on your active environment file
    - name: Dynamically include environment variables
      include_vars:
        file: "{{ playbook_dir }}/../env_vars/{{ inventory_file | default('dev') | basename | splitext | first }}.yml"

    # 2. Execute the baseline configuration role across all cluster nodes natively
    - name: Execute Common Baseline Tasks
      include_role:
        name: common

    # 3. Execute the webserver configuration role exclusively on target web application nodes
    - name: Execute Webserver Configuration Tasks
      include_role:
        name: webserver
      when: "'webservers' in group_names"

# PLAY 2: Baseline Package Version Auditing
- name: Ensure baseline packages are at the latest version
  hosts: all
  become: true
  ignore_unreachable: true
  tasks:
    - name: Update apt repo for Debian nodes
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure wireshark is at the latest version
      package:
        name: wireshark
        state: latest

