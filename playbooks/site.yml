---
- name: Configure Webservers and Deploy TODO Application
  hosts: webserver
  remote_user: ec2-user
  roles:
    - role: webserver
      tags: [webserver, apache]

- name: Include dynamic environment variables
  import_playbook: ../dynamic-assignments/env-vars.yml
  ignore_unreachable: true

- name: Import webserver assignment
  import_playbook: ../static-assignments/common.yml
  ignore_unreachable: true

- name: Import load balancer assignment
  import_playbook: ../static-assignments/loadbalancers.yml
  ignore_unreachable: true

- name: Import db-server assignment
  import_playbook: ../static-assignments/db-servers.yml
  ignore_unreachable: true
