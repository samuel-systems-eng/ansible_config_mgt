---
# PLAY 1: RedHat Web and Storage Baseline Packages
- name: Update web and NFS servers
  hosts: webservers, nfs
  remote_user: ec2-user
  become: true
  become_user: root
  ignore_unreachable: true  # 🛡️ Bypasses stopped AWS free-tier instances cleanly
  tasks:
    - name: Ensure wireshark is at the latest version
      yum:
        name: wireshark
        state: latest

# PLAY 2: Ubuntu Load Balancers and Databases Baseline Packages
- name: Update LB and DB servers
  hosts: lb, db
  remote_user: ubuntu
  become: true
  become_user: root
  ignore_unreachable: true  # 🛡️ Bypasses stopped AWS free-tier instances cleanly
  tasks:
    - name: Update apt repo
      apt:
        update_cache: yes

    - name: Ensure wireshark is at the latest version
      apt:
        name: wireshark
        state: latest

