---
# ==============================================================================
# PROD-GRADE WEBSERVER & TODO APP ARCHITECTURE AUTOMATION DEPLOYMENT TASKS
# ==============================================================================

# 1. Install Apache Core Package Components Natively
- name: Install Apache Web Server and core packages
  become: true
  ansible.builtin.yum:
    name: httpd
    state: present
  tags: [webserver, apache]

# 2. Install PHP and its required application extensions directly from native core channels
- name: Install PHP and application extensions
  become: true
  ansible.builtin.yum:
    name:
      - php
      - php-mysqlnd
      - php-xml
      - php-mbstring
      - php-zip
      - php-curl
      - unzip
    state: present
  tags: [webserver, apache]

# 3. Boot and enable services
- name: Ensure Apache service is enabled and active
  become: true
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  tags: [webserver, apache]

# 4. Fetch your application bundle using YOUR specific Artifactory Private IP
- name: Download verified application build archive from JFrog Artifactory
  become: true
  ansible.builtin.get_url:
    url: "http://172.31.29.120"
    dest: "/tmp/php-todo.tar.gz"
    url_username: "admin"
    url_password: "Qsnecse11"
  tags: [webserver, apache]

# 5. Purge stale deployment directory artifacts to keep the app space clean
- name: Clear old web server document root directory paths
  become: true
  ansible.builtin.file:
    path: "/var/www/html/*"
    state: absent
  tags: [webserver, apache]

# 6. Extract the code bundle directly into the active web space folder path
- name: Extract deployment archive package directly into Apache web document root
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/php-todo.tar.gz"
    dest: "/var/www/html/"
    remote_src: yes
  tags: [webserver, apache]

# 7. Set appropriate file permissions for the RedHat web manager daemon user
- name: Fix file ownership boundaries for the apache user account profile
  become: true
  ansible.builtin.file:
    path: "/var/www/html"
    owner: apache
    group: apache
    recurse: yes
    mode: '0775'
  tags: [webserver, apache]

# 8. Restart Apache to cleanly initialize the application configurations
- name: Restart Apache to apply configuration updates
  become: true
  ansible.builtin.service:
    name: httpd
    state: restarted
  tags: [webserver, apache]
